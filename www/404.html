<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Villa Takvimim</title>
<script>
  // Görev 45.1: Bu sayfa yalnız Cloudflare'da, paylaşım linkini karşılayan Function çalışmazsa görünür.
  // Adres bir paylaşım linkiyse (son parça villa-salta-k7m2 gibi) misafir sayfasına geçer.
  (function(){
    var p=location.pathname, i=p.lastIndexOf("/"), yol=p.slice(i+1);
    if(/^[a-z0-9-]+$/i.test(yol)){
      var ek=location.search ? "&"+location.search.slice(1) : "";
      location.replace(p.slice(0,i+1)+"g.html?v="+encodeURIComponent(yol)+ek);
    }
  })();
</script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#12232B;
  display:flex;min-height:90vh;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
  a{color:#0B5B57}</style>
</head>
<body>
<p>Sayfa bulunamadı.<br><a href="/">Villa Takvimim</a></p>
</body>
</html>
