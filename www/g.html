<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B5B57">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Villa</title>
<style>
  :root{--ink:#12232B;--muted:#6B7C85;--line:#E3E9EC;--soft:#F4F7F8;--dolu:#DDE4E7;--dip:#A3B0B6;
    --yes:#0B5B57;--yesKoyu:#084842;
    --serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#fff !important;color:var(--ink);color-scheme:light only;
    font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center}
  .w{width:100%;max-width:32rem;padding-bottom:calc(6rem + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
    -webkit-appearance:none;appearance:none;background-clip:padding-box}
  .pad{padding:0 1.25rem}
  .eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:var(--yes);font-weight:600}
  h1{font-family:var(--serif);font-weight:400;font-size:2rem;letter-spacing:-.02em;margin:.375rem 0 0}
  h2{font-family:var(--serif);font-weight:400;font-size:1.375rem;letter-spacing:-.02em;margin:0 0 1rem}
  .bolum{border-top:1px solid var(--line);margin-top:2rem;padding-top:2rem}
  .son{height:.5rem}

  /* galeri: tam genişlik, köşesiz */
  .galeri{position:relative}
  /* Düzeltme: şerit sadece yatay kaysın. overflow-y açık kalınca iPhone'da küsuratlı yükseklik yüzünden
     aşağı kaydırma hareketini şerit yutuyor, sayfa kaymıyordu. */
  .kaydir{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none}
  .kaydir::-webkit-scrollbar{display:none}
  .kaydir img{width:100%;height:auto;flex:none;aspect-ratio:4/3;object-fit:cover;
    scroll-snap-align:center;background:var(--soft);display:block}
  .sayac{position:absolute;right:.75rem;bottom:.75rem;background:rgba(18,35,43,.72);color:#fff;
    font-size:.75rem;padding:.25rem .625rem;border-radius:99px}

  /* üst şerit */
  .ust{position:sticky;top:0;z-index:50;background:var(--yes);color:#fff;
    padding:.75rem 1.25rem calc(.75rem + env(safe-area-inset-top));
    display:flex;justify-content:center}
  .ustIc{width:100%;max-width:29.5rem;display:flex;align-items:baseline;gap:.625rem;
    overflow:hidden;white-space:nowrap}
  .ustAd{font-family:var(--serif);font-size:1.125rem;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis}
  .ustKonum{font-size:.75rem;opacity:.85;flex:none}
  .dilBtn{margin-left:auto;flex:none;color:#fff;border:1px solid rgba(255,255,255,.45);
    border-radius:.5rem;padding:.25rem .5rem;font-size:.75rem;letter-spacing:.04em;
    font-family:var(--sans)}
  .dilBtn:active{opacity:.6}

  /* künye kutucukları */
  .kunye{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1.25rem}
  .kt{background:var(--soft);border-radius:.75rem;padding:.75rem .25rem;text-align:center;
    font-size:.75rem;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:.375rem;
    line-height:1.25}
  .ktIkon{width:1.75rem;height:1.75rem;border-radius:99px;background:#fff;color:var(--yes);
    display:flex;align-items:center;justify-content:center}
  .ktIkon svg{width:15px;height:15px}

  /* amblemli özellik listesi */
  .amblemler{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}
  .amb{display:flex;align-items:center;gap:.625rem;background:var(--soft);border-radius:.75rem;
    padding:.75rem .75rem;font-size:.8125rem;line-height:1.3}
  .ambIkon{width:2rem;height:2rem;border-radius:99px;background:#fff;color:var(--yes);flex:none;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(18,35,43,.06)}
  .ambIkon svg{width:17px;height:17px}

  /* dip bilgi */
  .dip{background:var(--soft);margin-top:2.5rem;padding:2rem 0 2.25rem;text-align:center}
  .dipAd{font-family:var(--serif);font-size:1.375rem;letter-spacing:-.02em}
  .dipKonum{font-size:.8125rem;color:var(--muted);margin-top:.25rem}
  .dipNot{font-size:.8125rem;color:var(--muted);margin-top:1rem;line-height:1.6}
  .dipTel{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.25rem;text-decoration:none;
    color:var(--yes);font-size:.9375rem;border:1px solid var(--yes);border-radius:.75rem;
    padding:.625rem 1.125rem}

  p{line-height:1.7;margin:0;font-size:.9375rem;white-space:pre-line;color:#2A3B44}
  .liste{display:grid;grid-template-columns:1fr 1fr;gap:.75rem .75rem;font-size:.875rem}
  .liste div{display:flex;gap:.5rem;align-items:flex-start}
  .tik{color:var(--yes);flex:none;margin-top:.0625rem}

  .odalar{display:grid;gap:.5rem}
  .oda{background:var(--soft);border-radius:.75rem;padding:.875rem 1rem}
  .odaAd{font-size:.9375rem;font-weight:600}
  .odaAlt{font-size:.8125rem;color:var(--muted);margin-top:.1875rem;line-height:1.5}
  .havuz{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;font-size:.875rem;
    color:var(--ink);background:var(--soft);border-radius:.75rem;padding:.875rem 1rem}
  .havuz svg{color:var(--yes)}

  .harita{display:flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;
    border:1px solid var(--line);border-radius:.75rem;padding:.875rem;font-size:.9375rem;color:var(--ink)}
  .harita svg{color:var(--yes)}

  .kural{margin:0;padding-left:1.125rem;font-size:.875rem;line-height:1.9;color:#2A3B44}
  .kural b{font-weight:600}
  .mesafe{display:grid;gap:.5rem;font-size:.875rem}
  .mesafe div{display:flex;justify-content:space-between;padding:.625rem 0;
    border-bottom:1px solid var(--line)}
  .mesafe div:last-child{border-bottom:0}
  .mesafe span{color:var(--muted)}
  /* 13.7 özel teklif şeridi */
  .tSerit{padding:.875rem 1.25rem;font-size:.875rem;line-height:1.45}
  .tSeritIc{max-width:29.5rem;margin:0 auto}
  .tSerit.yesil{background:#E3EFEC;color:var(--yesKoyu);border-bottom:1.5px solid var(--yes)}
  .tSerit.gri{background:#EEF1EF;color:#3F4843;border-bottom:1px solid var(--line)}
  .tsBas{font-size:1rem;font-weight:500;margin-bottom:.125rem}
  .tsFiyat{font-weight:500}
  .tSerit s,.tEski{color:var(--muted);font-weight:400}
  .mesafe .msAd{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink);min-width:0}
  .mesafe .msAd svg{color:var(--yes);flex:none}
  .mesafe b{font-weight:500;text-align:right;white-space:nowrap}
  .mesafe .msSure{color:var(--muted);font-weight:400}
  .konumAd{display:flex;align-items:center;gap:.5rem;font-size:.9375rem;margin-bottom:.5rem}
  .konumAd svg{color:var(--yes);flex:none}
  .yatakSat{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;font-size:.875rem;color:var(--ink)}
  .yatakSat svg{color:var(--yes);flex:none}

  /* ===== Görev 14: misafir sayfası netliği ===== */
  b,strong{font-weight:inherit}
  svg.ik{display:block;flex:none}
  .eyebrow{font-weight:400}
  .odaAd{font-weight:400}
  .alt .ic a{font-weight:500}
  .tsBas{font-weight:400;font-size:1.0625rem}
  .tsFiyat{font-weight:400}
  .konumBas{display:flex;align-items:center;gap:.375rem;margin-top:.5rem;font-size:1rem;color:var(--muted)}
  .konumBas svg{color:var(--yes)}
  /* 14.2 künye: 2 sütun, büyük rakam */
  .kunye{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.625rem;margin-top:1.25rem}
  .kunye.yataklar{margin-top:.625rem}
  .kt{display:flex;align-items:center;gap:.75rem;background:#fff;border:1px solid var(--line);border-radius:.875rem;
    padding:.75rem .875rem;text-align:left;font-size:inherit;flex-direction:row;line-height:1.2}
  .ktDaire{flex:none;width:40px;height:40px;border-radius:99px;background:#E3EFEC;color:var(--yes);display:flex;align-items:center;justify-content:center}
  .ktMetin{display:flex;flex-direction:column;min-width:0}
  .ktSayi{font-size:22px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
  .ktEt{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
  /* 14.3 bölüm başlıkları */
  h2.bBas{display:flex;align-items:center;gap:.5rem}
  h2.bBas svg{color:var(--yes)}
  .bAlt{font-size:.875rem;color:var(--muted);margin:-.625rem 0 1rem}
  .fiyatBas{display:flex;align-items:center;gap:.5rem;font-family:var(--serif);font-weight:400;font-size:1.25rem;letter-spacing:-.02em;margin:1.5rem 0 .25rem;color:var(--ink)}
  .fiyatBas svg{color:#3C4E8C}
  /* 14.4 seçimi temizle */
  .temizleKucuk{display:inline-flex;align-items:center;gap:.375rem;margin-top:.25rem;min-height:44px;padding:.375rem .875rem;
    border:1.5px solid #5F6A64;border-radius:.75rem;font-size:.875rem;color:var(--ink);background:#fff}
  .temizleKucuk:active{background:#E3EFEC;border-color:var(--yes)}
  .altBtn{display:flex;gap:.5rem;align-items:stretch}
  .altBtn a{flex:1 1 auto;width:auto}
  .altTemizle{flex:none;width:3.25rem;border:1.5px solid #5F6A64;border-radius:.75rem;display:flex;align-items:center;justify-content:center;color:var(--ink);background:#fff}
  .altFiyat{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
  .altTutar{color:var(--ink);font-size:.9375rem}
  .altTarih{color:var(--ink)}
  .altDep{font-size:.6875rem;color:#3C4E8C;white-space:nowrap}
  /* 14.5 konum */
  .mesafe{font-size:.9375rem}
  .mesafe div{align-items:center;gap:.75rem}
  .mesafe .msAd span{color:var(--ink)}
  .msDeger{display:flex;flex-direction:column;align-items:flex-end;font-size:17px;color:var(--ink) !important;white-space:nowrap;text-align:right}
  .msDeger .msSure{font-size:.8125rem;color:var(--muted)}
  .harita{background:#E6EEF1;border:1.5px solid #2E6E8E;color:#2E6E8E;min-height:3rem}
  .harita svg{color:#2E6E8E}
  /* 14.6 kurallar */
  .saatler{display:grid;grid-template-columns:1fr 1fr;gap:.625rem;margin-bottom:1rem}
  .saat{display:flex;align-items:center;gap:.625rem;border:1px solid var(--line);border-radius:.875rem;padding:.75rem .875rem}
  .saat svg{color:var(--yes)}
  .saat > span{display:flex;flex-direction:column}
  .saatEt{font-size:.8125rem;color:var(--muted)}
  .saatDeger{font-size:1.375rem;line-height:1.2;font-variant-numeric:tabular-nums}
  .kurallar{border:1px solid var(--line);border-radius:.875rem}
  .kSat{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem .875rem;border-bottom:1px solid var(--line)}
  .kSat:last-child{border-bottom:0}
  .kAd{display:flex;align-items:center;gap:.625rem;font-size:.9375rem;min-width:0}
  .kAd svg{color:var(--yes)}
  .rz{flex:none;display:inline-flex;align-items:center;gap:.3125rem;border-radius:99px;padding:.3125rem .75rem .3125rem .625rem;font-size:.9375rem;line-height:1.2}
  .rz.evet{background:var(--yes);color:#fff}
  .rz.hayir{background:#F7E6EB;color:#9B2C4A}
  .rz.gri{background:#EEF1EF;color:#3F4843;padding-left:.75rem}
  .kBilgi{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.5rem}
  .kBilgi li{display:flex;gap:.5rem;align-items:flex-start;font-size:.875rem;line-height:1.5;color:#2A3B44}
  .kBilgi svg{color:var(--yes);margin-top:.0625rem}
  /* 14.7 hasar depozitosu kartı */
  .depKart{display:flex;gap:.75rem;align-items:flex-start;background:#E8EAF1;border:1.5px solid #3C4E8C;border-radius:.875rem;padding:1rem;margin-top:.75rem;color:#24305A}
  .depKart svg{color:#3C4E8C;margin-top:.0625rem}
  .dkBas{font-size:20px;line-height:1.25}
  .dkAlt{font-size:.875rem;line-height:1.45;margin-top:.25rem}
  .depKart.kucuk{padding:.75rem .875rem;margin-top:1rem}
  .depKart.kucuk .dkBas{font-size:1.0625rem}
  .depKart.kucuk .dkAlt{font-size:.8125rem}
  .dipTel svg{color:var(--yes)}
  /* 15.6 bilmeniz gerekenler, 15.7 belge no */
  .bilKutu{background:#EEF1EF;border-radius:.875rem;padding:.875rem 1rem;margin-top:.75rem}
  .bilBas{display:flex;align-items:center;gap:.5rem;font-size:.9375rem;color:#3F4843}
  .bilBas svg{color:#5F6A64}
  .bilKutu ul{margin:.5rem 0 0;padding-left:1.125rem;font-size:.9375rem;line-height:1.6;color:#2A3B44}
  .belgeNo{display:flex;align-items:center;justify-content:center;gap:.375rem;margin-top:1.25rem;font-size:.8125rem;color:var(--muted);line-height:1.4}
  .belgeNo svg{color:var(--yes)}
  /* 15.8 geniş ekran: sayfa genişler, takvimde iki ay yan yana */
  @media (min-width:720px){
    .w{max-width:50rem}
    .aybar.iki{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:1.5rem;text-align:center}
    .ayIki{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
  }
  /* 15.4 opsiyonlu günler */
  .g.ops{background:repeating-linear-gradient(135deg,#C9D2E3 0 4px,#EEF1F6 4px 9px);color:#2F3B55}
  .g.ops .f{visibility:hidden}
  .opsOrnek{background:repeating-linear-gradient(135deg,#C9D2E3 0 3px,#EEF1F6 3px 6px)}
  /* 15.2 odalar, 15.3 havuz */
  .havuzSat{display:flex;align-items:flex-start;gap:.625rem;margin-top:.75rem;font-size:.9375rem;line-height:1.45;border:1px solid var(--line);border-radius:.875rem;padding:.75rem .875rem}
  .havuzSat svg{color:var(--yes);margin-top:.0625rem}
  .odaKartlar{display:grid;gap:.625rem}
  .odaK{border:1px solid var(--line);border-radius:.875rem;padding:.75rem .875rem}
  .odaKBas{font-size:1rem}
  .odaKKat{color:var(--muted)}
  .odaKOz{display:flex;flex-wrap:wrap;gap:.375rem .875rem;margin-top:.5rem;font-size:.875rem;color:#2A3B44}
  .odaKOz > span{display:inline-flex;align-items:center;gap:.3125rem}
  .odaKOz svg{color:var(--yes)}
  /* 15.1 harita */
  .haritaKutu{display:block;position:relative;width:100%;height:220px;border-radius:.875rem;overflow:hidden;border:1px solid var(--line);
    margin:.5rem 0 1rem;padding:0;background:var(--soft);text-align:left;isolation:isolate}
  .haritaIc{position:absolute;inset:0;z-index:0}
  .haritaIc .leaflet-control-attribution{font-size:10px}
  .hBuyut{position:absolute;left:.625rem;top:.625rem;z-index:500;display:inline-flex;align-items:center;gap:.375rem;background:#fff;
    color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:.3125rem .75rem;font-size:.8125rem;box-shadow:0 1px 4px rgba(18,35,43,.15)}
  .hNot{font-size:.8125rem;color:var(--muted);margin:-.5rem 0 1rem}
  .haritaTam{position:fixed;inset:0;z-index:90;background:#fff}
  .haritaTamIc{position:absolute;inset:0}
  .hKapat{position:absolute;right:max(.75rem, env(safe-area-inset-right));top:calc(.75rem + env(safe-area-inset-top));z-index:1000;width:3rem;height:3rem;
    border-radius:99px;background:#fff;border:1.5px solid #5F6A64 !important;display:flex;align-items:center;justify-content:center;color:var(--ink)}
  /* takvim */
  .aybar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
  .aybar .ad{font-family:var(--serif);font-size:1.0625rem}
  .aybar button{padding:.5rem;border-radius:99px;line-height:0;color:var(--muted)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow div{text-align:center;font-size:.6875rem;letter-spacing:.02em;
    color:var(--muted);padding:.375rem 0}
  .ay{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:3.5rem;row-gap:.1875rem}
  .g{height:3.5rem;min-height:3.5rem;max-height:3.5rem;align-self:stretch;margin:0;padding:0;
    border:0;box-sizing:border-box;background-clip:padding-box;
    border-radius:9px;display:grid;grid-template-rows:1.125rem .8125rem;
    align-content:center;justify-items:center;font-size:.9375rem;line-height:1;overflow:hidden}
  .g>span:first-child{height:1.125rem;line-height:1.125rem;display:block}
  .g .f{line-height:.8125rem;font-size:.5rem;color:var(--muted);letter-spacing:-.02em;
    white-space:nowrap}
  .g.dolu{color:var(--dip)}
  .g.dolu .f{visibility:hidden}
  .g.gecmis{color:#C3CDD2}
  .g.gecmis .f{visibility:hidden}
  .g.sec{background:var(--yes) !important;color:#fff}
  .g.sec .f{color:rgba(255,255,255,.85);visibility:visible}
  .g.ara{background:#DDEAE7 !important;border-radius:0}
  .g.secilebilir{cursor:pointer}
  .uyari{font-size:.8125rem;color:#9B2C4A;margin-top:.75rem;min-height:1.25rem}
  .aciklik{display:flex;gap:1rem;margin-top:1rem;font-size:.8125rem;color:var(--muted);
    align-items:center;flex-wrap:wrap}
  .ornek{width:1rem;height:1rem;border-radius:5px;display:inline-block;vertical-align:-3px;margin-right:.375rem}

  .fiyatKutu{background:var(--soft); border-radius:.875rem; padding:1rem 1.125rem; margin-top:1rem}
  .fs{display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
    padding:.4375rem 0; font-size:.9375rem}
  .fs span:first-child{color:var(--muted)}
  .fs span:last-child{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  .fsTop{border-top:1px solid var(--line); margin-top:.375rem; padding-top:.75rem;
    font-family:var(--serif); font-size:1.25rem}
  .fsTop span:first-child{color:var(--ink)}
  .fsAlt{font-size:.75rem}
  .fsNot{font-size:.75rem; color:var(--muted); margin-top:.5rem; line-height:1.5}
  /* 10.15 "3 gece" satırı: dokununca gece gece döküm */
  button.fs{width:100%; background:none; border:0; font:inherit; color:inherit; text-align:left; cursor:pointer;
    -webkit-appearance:none; appearance:none; min-height:2.75rem; padding:.4375rem 0}
  .fsGece span:first-child{display:inline-flex; align-items:center; gap:.375rem; color:var(--ink)}
  .fsGece .ok{display:inline-block; width:.4375rem; height:.4375rem; border-right:2px solid currentColor;
    border-bottom:2px solid currentColor; transform:rotate(45deg) translateY(-2px); transition:transform .15s ease-out}
  .fsGece[aria-expanded="true"] .ok{transform:rotate(225deg) translate(-1px,-1px)}
  .fsDokum{padding:0 0 .25rem .75rem; border-left:2px solid var(--line); margin:.125rem 0 .375rem}
  .fsDokum .fs{padding:.25rem 0; font-size:.875rem}
  .ozetkutu{background:var(--soft);border-radius:.875rem;padding:1rem;margin-top:1rem;
    display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .ozetkutu .top{font-family:var(--serif);font-size:1.25rem;letter-spacing:-.02em}
  .temizle{font-size:.875rem;color:var(--ink);background:#fff;border:2px solid #5F6A64;border-radius:.75rem;
    min-height:48px;padding:.375rem .875rem;flex:none}
  .temizle:active{border-color:#0B5B57;background:#E3EFEC}
  .fiyatSor{font-size:1rem !important;line-height:1.35}
  .kisi{display:flex;align-items:center;gap:.75rem;font-size:.9375rem;
    justify-content:space-between;padding:.625rem 0;border-bottom:1px solid var(--line)}
  .kisi:last-of-type{border-bottom:0}
  .kisi .alt2{font-size:.75rem;color:var(--muted);margin-top:.125rem}
  .kisiler{margin-top:1rem}
  .adet{display:flex;align-items:center;gap:.25rem}
  .adet button{width:2rem;height:2rem;border-radius:99px;background:var(--soft);font-size:1.125rem;
    display:flex;align-items:center;justify-content:center;line-height:0}
  .adet span{min-width:1.75rem;text-align:center;font-variant-numeric:tabular-nums}
  .adet button:disabled{opacity:.3}

    return '<div class="depKart'+(kucuk?" kucuk":"")+'">'+ik("kalkan",kucuk?22:28)+"<div>"+
      '<div class="dkBas">'+(EN?"Damage deposit: ":"Hasar depozitosu: ")+nf.format(dep)+" ₺</div>"+
      '<div class="dkAlt">'+(EN?"Taken at check-in and refunded at check-out if there is no damage. Not included in the total price."
                              :"Girişte alınır, hasar yoksa çıkışta iade edilir. Toplam fiyata dahil değildir.")+"</div></div></div>";
  }
  function depTutar(){ var b=D.bilgi||{}; return (teklifAktif() && TK.depozito) ? TK.depozito : (+b.depozito||0); }
  function tik(){
    return '<svg class="tik" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
  }
  function ikon(t){
    var y={
      kisi:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8"/>',
      oda:'<path d="M3 18v-6a2 2 0 012-2h14a2 2 0 012 2v6M3 18h18M3 18v2M21 18v2M6 10V7a2 2 0 012-2h8a2 2 0 012 2v3"/>',
      banyo:'<path d="M4 12h16v3a5 5 0 01-5 5H9a5 5 0 01-5-5v-3zM7 12V5a2 2 0 114 0"/>',
      alan:'<path d="M3 3h18v18H3zM9 3v18M3 9h18"/>',
      havuz:'<path d="M2 18c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2M6 14V5a2 2 0 114 0M14 14V5a2 2 0 114 0"/>',
      pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0zM12 13a3 3 0 100-6 3 3 0 000 6"/>'
    }[t]||"";
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'+y+"</svg>";
  }

  function kaydirmaTakip(){
    var el=document.getElementById("kaydir"), sy=document.getElementById("sayac");
    if(!el||!sy) return;
    el.addEventListener("scroll",function(){
      var n=D.fotolar.length;
      var i=Math.round(el.scrollLeft/(el.scrollWidth/n));
      i=Math.max(0,Math.min(n-1,i));
      sy.textContent=(i+1)+" / "+n;
    },{passive:true});
  }

  var sec={bas:null,bit:null}, say={yetiskin:2,cocuk:0,evcil:0}, uyariMetin="";

  function serbestMi(k){ return (D.dolu||[]).indexOf(k)<0; }
  function yarimVar(k,t){ return (D.yarim||[]).indexOf(k+":"+t)>=0; }
  // 15.4 opsiyonlu geceler: seçilemez
  function opsGece(k){ var bk=fmt(bugun); return (D.opsiyon||[]).some(function(o){ return o && o.son>=bk && o.b<=k && k<o.s; }); }
  function girisUygun(k){ return serbestMi(k) && !yarimVar(k,"a") && !opsGece(k); }
  function cikisUygun(k){ return serbestMi(k) && !yarimVar(k,"s"); }
  function araBos(a,b){
    var d=new Date(a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10));
    d.setDate(d.getDate()+1);
    while(fmt(d)<b){
      var k=fmt(d);
      if(!serbestMi(k) || yarimVar(k,"s") || yarimVar(k,"a") || opsGece(k)) return false;
      d.setDate(d.getDate()+1);
    }
    return true;
  }
  function geceSay(){
    if(!sec.bas||!sec.bit) return 0;
    return Math.round((new Date(sec.bit)-new Date(sec.bas))/86400000);
  }
  function toplam(){
    var t=0, eksik=0;
    var d=new Date(sec.bas);
    while(fmt(d)<sec.bit){
      var f=(D.fiyat||{})[fmt(d)];
      if(f) t+=f; else eksik++;
      d.setDate(d.getDate()+1);
    }
    return {tutar:t, eksik:eksik};
  }

  function secimTemizle(){ sec={bas:null,bit:null}; uyariMetin=""; takvimCiz(); altCiz(); secimKutusu(); }
  // 18.1: seçim kuralı (uygulamadaki villa takvimiyle aynı)
  //  · hiçbir şey seçili değil → dokunulan gün giriş
  //  · sadece giriş S → Y > S: S–Y (arada dolu gece varsa Y yeni giriş + uyarı); Y < S: Y yeni giriş; Y = S: seçim kalkar
  //  · aralık seçiliyken herhangi bir güne dokunmak seçimi kaldırır (yeni seçim başlamaz)
  function gunTikla(k){
    uyariMetin="";
    if(k<fmt(bugun)) return;
    if(sec.bas && sec.bit){ secimTemizle(); return; }
    var girisOlur=function(){ return girisUygun(k) && !opsGece(k); };
    var girisUyari=function(){ uyariMetin=opsGece(k)?"Bu tarihler şu an opsiyonlu.":"Bu güne giriş yapılamıyor, dolu."; };
    if(!sec.bas){
      if(girisOlur()) sec={bas:k,bit:null}; else girisUyari();
    } else if(k===sec.bas){ secimTemizle(); return; }
    else if(k<sec.bas){
      if(girisOlur()) sec={bas:k,bit:null}; else girisUyari();
    } else {
      if(cikisUygun(k) && araBos(sec.bas,k)) sec.bit=k;
      else {
        uyariMetin=((function(){ for(var d=new Date(sec.bas);fmt(d)<k;d.setDate(d.getDate()+1)) if(opsGece(fmt(d))) return 1; })()?"Bu tarihler şu an opsiyonlu.":"Bu tarihler arasında dolu gün var.");
        if(girisOlur()) sec={bas:k,bit:null};
      }
    }
    takvimCiz(); altCiz(); secimKutusu();
  }

  // 15.8: 720px'ten geniş ekranda iki ay yan yana (telefonda tek ay)
  var IKI_AY=window.matchMedia ? window.matchMedia("(min-width:720px)") : null;
  if(IKI_AY){ var ikiAyDeg=function(){ if(D && D.ad) takvimCiz(); };
    if(IKI_AY.addEventListener) IKI_AY.addEventListener("change",ikiAyDeg); else if(IKI_AY.addListener) IKI_AY.addListener(ikiAyDeg); }
  function ayIzgara(y,m,id){
    var adet=new Date(y,m+1,0).getDate(), lead=(new Date(y,m,1).getDay()+6)%7;
    var fiyat=D.fiyat||{}, bugunK=fmt(bugun);
    var h='<div class="dow">'+(EN?["Mo","Tu","We","Th","Fr","Sa","Su"]:["Pt","Sa","Ça","Pe","Cu","Ct","Pz"])
        .map(function(x){ return "<div>"+x+"</div>"; }).join("")+"</div>"+
      '<div class="ay" id="'+id+'">';
    for(var i=0;i<lead;i++) h+="<div></div>";
    for(var g=1;g<=adet;g++){
      var k=fmt(new Date(y,m,g));
      var tam=!serbestMi(k), ys=yarimVar(k,"s"), ya=yarimVar(k,"a");
      var gecmis=k<bugunK, f=fiyat[k], st="", cls="g";
      var secili=(k===sec.bas||k===sec.bit), arada=sec.bit&&k>sec.bas&&k<sec.bit;
      if(gecmis) cls+=" gecmis";
      else if(secili) cls+=" sec";
      else if(arada) cls+=" ara";
      else if(tam){ cls+=" dolu"; st="background:var(--dolu)"; }
      else if(opsGece(k)){ cls+=" ops"; }
      else if(ys) st="background:linear-gradient(110deg,var(--dolu) 49.5%,transparent 50.5%)";
      else if(ya) st="background:linear-gradient(110deg,transparent 49.5%,var(--dolu) 50.5%)";
      if(!gecmis) cls+=" secilebilir";
      h+='<div class="'+cls+'" data-k="'+k+'" style="'+st+'"><span>'+g+"</span>"+
         '<span class="f">'+((!gecmis && !tam && f)?kisaFiyat(f):"")+"</span></div>";
    }
    return h+"</div>";
  }
  function takvimCiz(){
    var t=document.getElementById("takvim"); if(!t) return;
    var iki=!!(IKI_AY && IKI_AY.matches);
    var y=imlec.getFullYear(), m=imlec.getMonth(), d2=new Date(y,m+1,1);
    var ok=function(yon){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="'+(yon<0?"M15 18l-6-6 6-6":"M9 18l6-6-6-6")+'"/></svg>'; };
    var h='<div class="aybar'+(iki?" iki":"")+'">'+
      '<button id="ay-once" aria-label="Önceki ay">'+ok(-1)+"</button>"+
      '<div class="ad">'+AYLAR[m]+" "+y+"</div>"+
      (iki?'<div class="ad">'+AYLAR[d2.getMonth()]+" "+d2.getFullYear()+"</div>":"")+
      '<button id="ay-sonra" aria-label="Sonraki ay">'+ok(1)+"</button></div>";
    h+= iki ? '<div class="ayIki"><div>'+ayIzgara(y,m,"ay")+"</div><div>"+ayIzgara(d2.getFullYear(),d2.getMonth(),"ay2")+"</div></div>"
            : ayIzgara(y,m,"ay");
    h+='<div class="uyari">'+esc(uyariMetin)+"</div>";
    if(sec.bas) h+='<button class="temizleKucuk" id="tmzUst">'+ik("x",16)+"<span>"+CEV("Seçimi temizle")+"</span></button>";
    t.innerHTML=h;
    var tu=document.getElementById("tmzUst"); if(tu) tu.onclick=secimTemizle;
    document.getElementById("ay-once").onclick=function(){
      imlec=new Date(imlec.getFullYear(),imlec.getMonth()-1,1); takvimCiz(); };
    document.getElementById("ay-sonra").onclick=function(){
      imlec=new Date(imlec.getFullYear(),imlec.getMonth()+1,1); takvimCiz(); };
    Array.prototype.forEach.call(t.querySelectorAll(".ay"),function(a){
      a.addEventListener("click",function(e){ var c=e.target.closest(".secilebilir"); if(c) gunTikla(c.dataset.k); });
    });
  }

  function tarihMetni(){
    var a=new Date(sec.bas), z=new Date(sec.bit);
    var m1=AYLAR[a.getMonth()], m2=AYLAR[z.getMonth()];
    return a.getMonth()===z.getMonth()
      ? a.getDate()+" – "+z.getDate()+" "+m2+" "+z.getFullYear()
      : a.getDate()+" "+m1+" – "+z.getDate()+" "+m2+" "+z.getFullYear();
  }

  function altCiz(){
    var bar=document.getElementById("altbar");
    if(!bar){ bar=document.createElement("div"); bar.className="alt"; bar.id="altbar";
      document.body.appendChild(bar); }
    var b=D.bilgi||{}, tel=telNo(b.whatsapp);

    if(!sec.bas || !sec.bit){
      bar.innerHTML='<div class="ic">'+
        (sec.bas?'<div class="altozet"><span>Giriş '+tarihKisa(sec.bas)+'</span><span>Çıkış gününü seçin</span></div>':"")+
        (tel?'<a href="https://wa.me/'+tel+'?text='+encodeURIComponent((D.ad||"Villa")+" için bilgi almak istiyorum.")+'" target="_blank" rel="noopener">WhatsApp\'tan bilgi al</a>'
            :'<a class="pasif">Takvimden tarih seçin</a>')+"</div>";
      return;
    }
    var t=toplam(), gc=geceSay();
    var e2=D.ek||{}, ekU2=(e2.sinir&&e2.ucret&&gc<=e2.sinir)?e2.ucret:0;
    var satir=teklifAktif() ? nf.format(TK.konaklama)+" ₺" : (t.eksik? CEV("Fiyatı sorun") : nf.format(t.tutar+ekU2)+" ₺");
    var dep2=depTutar();
    bar.innerHTML='<div class="ic">'+
      '<div class="altozet"><span><span class="altTarih">'+tarihMetni()+"</span> · "+gc+" gece · "+kisiOzet().join(", ")+"</span>"+
      '<span class="altFiyat"><span class="altTutar">'+satir+"</span>"+
        (dep2?'<span class="altDep">'+(EN?"+ "+nf.format(dep2)+" ₺ refundable deposit":"+ "+nf.format(dep2)+" ₺ iade edilen depozito")+"</span>":"")+"</span></div>"+
      '<div class="altBtn"><button class="altTemizle" id="altTmz" aria-label="'+CEV("Seçimi temizle")+'">'+ik("x",20)+"</button>"+
      (tel?'<a href="#" id="rez-ac">Rezervasyon isteği oluştur</a>'
          :'<a class="pasif">İletişim bilgisi yok</a>')+"</div></div>";
    document.getElementById("altTmz").onclick=secimTemizle;
    var ra=document.getElementById("rez-ac");
    if(ra) ra.onclick=function(e){ e.preventDefault(); onayAc(); };
  }
  function onayAc(){
    var b=D.bilgi||{}, mx=parseInt(b.kapasite||"20",10)||20, tel=telNo(b.whatsapp);
    var o=document.createElement("div");
    o.className="onay"; o.id="onay";
    function ciz2(){
      var t=toplam(), gc=geceSay();
      var mesaj=(D.ad||"Villa")+" için "+tarihMetni()+" tarihleri arasında ("+gc+" gece) "+
        kisiMetin()+" ile rezervasyon yapmak istiyorum. Uygunluk ve fiyat için bilgi alabilir miyim?"+
        (depTutar()?" "+nf.format(depTutar())+" ₺ hasar depozitosunun girişte alınıp çıkışta iade edileceğini biliyorum.":"")+
        (teklifAktif()?" Teklif kodu: "+TK.kod:"");
      o.innerHTML='<div class="onaykutu"><h3>Kaç kişi geliyorsunuz?</h3>'+
        '<div style="color:var(--muted);font-size:.875rem;margin:.375rem 0 1rem">'+
          esc(D.ad||"Villa")+" · "+tarihMetni()+" · "+gc+" "+(EN?"nights":"gece")+"</div>"+
        '<div class="kisiler" id="onay-sayac">'+sayaclar(mx,b.evcil,"o")+"</div>"+
        '<div class="ozetsatir"><span style="color:var(--muted)">Misafir</span><span>'+esc(kisiMetin())+"</span></div>"+
        '<div class="fiyatKutu" id="onay-fiyat">'+fiyatOzet()+"</div>"+depKart(depTutar(),true)+
        '<a class="onaybtn" href="https://wa.me/'+tel+'?text='+encodeURIComponent(mesaj)+
          '" target="_blank" rel="noopener">WhatsApp\'tan gönder</a>'+
        '<button class="vazgec" id="onay-kapat">Vazgeç</button></div>';
      o.querySelector("#onay-kapat").onclick=function(){ o.remove(); secimKutusu(); altCiz(); };
      o.querySelector("#onay-sayac").onclick=function(e){ sayacTikla(e,mx,ciz2); };
      o.querySelector("#onay-fiyat").onclick=function(e){ dokumTikla(e,ciz2); };
    }
    ciz2();
    o.addEventListener("click",function(e){ if(e.target===o){ o.remove(); secimKutusu(); altCiz(); } });
    document.body.appendChild(o);
  }

  function tarihKisa(k){ var d=new Date(k); return d.getDate()+" "+AYLAR[d.getMonth()]; }
  function telNo(x){
    if(!x) return "";
    var t=String(x).replace(/\D/g,"");
    if(t.charAt(0)==="0") t="9"+t;
    if(t.charAt(0)==="5") t="90"+t;
    return t.length>=11?t:"";
  }

  function kisiOzet(){
    var p=[];
    p.push(say.yetiskin+" yetişkin");
    if(say.cocuk) p.push(say.cocuk+" çocuk");
    if(say.evcil) p.push(say.evcil+" evcil hayvan");
    return p;
  }
  function kisiMetin(){
    var p=kisiOzet();
    if(p.length===1) return p[0];
    return p.slice(0,-1).join(", ")+" ve "+p[p.length-1];
  }

  function sayac(k,ad,not,min,max,ek){
    var d=say[k];
    return '<div class="kisi"><span>'+ad+(not?'<div class="alt2">'+not+"</div>":"")+"</span>"+
      '<span class="adet"><button data-e="'+k+'"'+(d<=min?" disabled":"")+'>−</button>'+
      '<span id="'+(ek||"s")+'-'+k+'">'+d+'</span>'+
      '<button data-a="'+k+'"'+(d>=max?" disabled":"")+">+</button></span></div>";
  }
  function sayaclar(mx,evcilVar,ek){
    return sayac("yetiskin","Yetişkin","",1,mx,ek)+
           sayac("cocuk","Çocuk","0–12 yaş",0,mx,ek)+
           (evcilVar===false
             ? '<div class="kisi"><span>Evcil hayvan<div class="alt2">Kabul edilmiyor</div></span></div>'
             : sayac("evcil","Evcil hayvan","",0,5,ek));
  }
  function sayacTikla(e,mx,sonra){
    var btn=e.target.closest("button[data-a],button[data-e]"); if(!btn) return false;
    var art=btn.dataset.a, eks=btn.dataset.e;
    if(art){
      if((art==="yetiskin"||art==="cocuk") && say.yetiskin+say.cocuk>=mx) return true;
      if(art==="evcil" && say.evcil>=5) return true;
      say[art]++;
    } else if(eks){
      if(eks==="yetiskin" && say.yetiskin<=1) return true;
      if(say[eks]<=0) return true;
      say[eks]--;
    }
    sonra(); return true;
  }

  // 10.15 Fiyat özeti (seçim kutusu ve "Kaç kişi geliyorsunuz?" panelinde aynı):
  //   3 gece            3.400 ₺   ← gece fiyatları farklıysa dokununca gece gece döküm
  //   Kısa konaklama   +5.000 ₺
  //   Toplam            8.400 ₺   ← depozito toplama EKLENMEZ
  //   Girişte 5.000 ₺ hasar depozitosu alınır, çıkışta iade edilir.
  var dokumAcik=false;
  function fiyatOzet(){
    var t=toplam(), gc=geceSay(), b=D.bilgi||{};
    var ek=(D.ek&&D.ek.sinir&&D.ek.ucret&&gc<=D.ek.sinir)?D.ek.ucret:0;
    var dep=b.depozito||0, gece=gc+" "+(EN?(gc===1?"night":"nights"):"gece");
    if(teklifAktif()) dep=TK.depozito||dep;
    var not="";   // 14.7: depozito artık ayrı kartta (depKart)
    if(teklifAktif()){
      return '<div class="fs"><span style="color:var(--ink)">'+gece+" · "+CEV("size özel")+"</span><span>"+
          (TK.normal && TK.normal!==TK.konaklama ? '<s class="tEski">'+nf.format(TK.normal)+" ₺</s> " : "")+nf.format(TK.konaklama)+" ₺</span></div>"+
        '<div class="fs fsTop"><span>'+CEV("Toplam")+"</span><span>"+nf.format(TK.konaklama)+" ₺</span></div>"+not;
    }
    if(t.eksik) return '<div class="fs fsTop"><span>'+CEV("Toplam")+'</span><span class="fiyatSor" style="white-space:normal">'+
      CEV("Bu tarihlerin fiyatını villa sahibine sorun")+"</span></div>"+not;
    var gunler=[], d=new Date(sec.bas);
    while(fmt(d)<sec.bit){ gunler.push({d:new Date(d), f:(D.fiyat||{})[fmt(d)]}); d.setDate(d.getDate()+1); }
    var ayni=gunler.every(function(g){ return g.f===gunler[0].f; });
    var h;
    if(ayni || gc<2){
      h='<div class="fs"><span style="color:var(--ink)">'+gece+(gc>1?" × "+nf.format(gunler[0].f)+" ₺":"")+"</span><span>"+nf.format(t.tutar)+" ₺</span></div>";
    } else {
      h='<button class="fs fsGece" data-dokum aria-expanded="'+dokumAcik+'"><span>'+gece+'<i class="ok" aria-hidden="true"></i></span><span>'+nf.format(t.tutar)+" ₺</span></button>"+
        (dokumAcik?'<div class="fsDokum">'+gunler.map(function(g){
          return '<div class="fs"><span>'+g.d.getDate()+" "+AYLAR[g.d.getMonth()].slice(0,3)+"</span><span>"+nf.format(g.f)+" ₺</span></div>";
        }).join("")+"</div>":"");
    }
    if(ek) h+='<div class="fs"><span>'+CEV("Kısa konaklama ücreti")+"</span><span>+"+nf.format(ek)+" ₺</span></div>";
    h+='<div class="fs fsTop"><span>'+CEV("Toplam")+"</span><span>"+nf.format(t.tutar+ek)+" ₺</span></div>"+not;
    return h;
  }
  function dokumTikla(e,sonra){
    if(!e.target.closest("[data-dokum]")) return false;
    dokumAcik=!dokumAcik; sonra(); return true;
  }

  // "Girişte 5.000 ₺ hasar depozitosu alınır, çıkışta iade edilir."
  function depNot(dep){
    return EN ? "A "+nf.format(dep)+" ₺ damage deposit is taken at check-in and refunded at check-out."
              : "Girişte "+nf.format(dep)+" ₺ hasar depozitosu alınır, çıkışta iade edilir.";
  }
  function secimKutusu(){
    var el=document.getElementById("secimAlan"); if(!el) return;
    var b=D.bilgi||{}, mx=parseInt(b.kapasite||"20",10)||20;
    if(!sec.bas||!sec.bit){ el.innerHTML=""; return; }
    var t=toplam(), gc=geceSay();
    var ek=(D.ek&&D.ek.sinir&&D.ek.ucret&&gc<=D.ek.sinir)?D.ek.ucret:0;
    // Toplam = konaklama + kısa konaklama ücreti. Depozito toplama EKLENMEZ, ayrı satırda yazılır.
    var tka=teklifAktif(), eksik=t.eksik && !tka;
    var konaklamaT=tka ? TK.konaklama : t.tutar+ek;

    var h='<h3 class="fiyatBas">'+ik("cuzdan",22)+"<span>"+CEV("Fiyat")+"</span></h3>";
    if(!eksik) h+='<div class="fiyatKutu">'+fiyatOzet()+"</div>";
    h+=depKart(depTutar());
    h+='<div class="ozetkutu"><div class="sol">'+
      '<div class="top'+(eksik?" fiyatSor":"")+'">'+(eksik?CEV("Bu tarihlerin fiyatını villa sahibine sorun"):nf.format(konaklamaT)+" ₺")+"</div>"+
      '<div style="color:var(--muted)">'+tarihMetni()+" · "+gc+" gece</div></div>"+
      '<button class="temizle" id="tmz">'+CEV("Seçimi temizle")+"</button></div>"+
      '<div class="kisiler">'+sayaclar(mx,b.evcil)+"</div>";
    el.innerHTML=h;

    document.getElementById("tmz").onclick=function(){
      sec={bas:null,bit:null}; takvimCiz(); altCiz(); secimKutusu(); };
    el.onclick=function(e){
      if(dokumTikla(e,secimKutusu)) return;
      sayacTikla(e,mx,function(){ secimKutusu(); altCiz(); });
    };
  }

})();
</script>
</body>
</html>
