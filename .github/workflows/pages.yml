name: Test sitesi (GitHub Pages)

# main'e her gönderimde www/ klasörü test adresine yayınlanır:
# https://zeydusht.github.io/villa-takvimim/
# Canlı site (villatakvim.netlify.app) bundan etkilenmez.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      # GitHub bazen yüklenen paketi deploy adımına geç gösteriyor ("No artifacts named github-pages"):
      # biraz bekle, ilk deneme düşerse bir kez daha dene.
      - run: sleep 20
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
